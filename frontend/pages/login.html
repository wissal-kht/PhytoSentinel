<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhytoSentinel — Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles1.css" />
    <style>
      /* ── Variables (reprise du thème PhytoSentinel) ── */
      :root {
        --bg-0: #030b05;
        --bg-1: #061210;
        --bg-2: #0c1f14;
        --bg-3: #122819;
        --green: #4ade80;
        --green-mid: #22c55e;
        --green-dk: #166534;
        --lime: #a3e635;
        --teal: #2dd4bf;
        --amber: #fbbf24;
        --red: #f87171;
        --t1: #f0fdf4;
        --t2: #bbf7d0;
        --t3: #86efac;
        --tm: rgba(74, 222, 128, 0.45);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg-0);
        color: var(--t1);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background-image:
          linear-gradient(rgba(74, 222, 128, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(74, 222, 128, 0.03) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      h1,
      h2,
      h3,
      .brand {
        font-family: "Syne", sans-serif;
      }

      .auth-card {
        max-width: 520px;
        width: 100%;
        background: rgba(8, 22, 15, 0.88);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(74, 222, 128, 0.22);
        border-radius: 32px;
        padding: 2.4rem 2rem;
        box-shadow: 0 28px 48px -12px rgba(0, 0, 0, 0.55);
      }

      /* Logo */
      .logo-wrap {
        text-align: center;
        margin-bottom: 28px;
      }
      .logo-icon {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #22c55e, #166534);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
      }
      .logo-name {
        font-size: 22px;
        font-weight: 800;
        color: var(--t1);
      }
      .logo-name span {
        color: var(--green);
      }
      .logo-sub {
        font-size: 12.5px;
        color: var(--tm);
        margin-top: 4px;
      }

      /* Onglets */
      .auth-tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 26px;
        border-bottom: 1px solid rgba(74, 222, 128, 0.18);
        padding-bottom: 12px;
      }
      .auth-tab {
        background: none;
        border: none;
        font-size: 16px;
        font-weight: 700;
        font-family: "Syne", sans-serif;
        padding: 7px 14px;
        cursor: pointer;
        color: var(--t3);
        transition: 0.2s;
        border-bottom: 2px solid transparent;
        margin-bottom: -13px;
      }
      .auth-tab.active {
        color: var(--green);
        border-bottom-color: var(--green);
      }

      /* Formulaires */
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .auth-form.hidden {
        display: none;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: var(--tm);
        letter-spacing: 0.5px;
      }
      .form-group input,
      .form-group select {
        background: rgba(12, 31, 20, 0.7);
        border: 1px solid rgba(74, 222, 128, 0.18);
        border-radius: 13px;
        padding: 12px 15px;
        color: var(--t1);
        font-size: 14px;
        font-family: "DM Sans", sans-serif;
        transition: 0.2s;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.18);
      }
      .form-group select option {
        background: #0c1f14;
      }

      /* Bouton principal */
      .btn-auth {
        background: linear-gradient(105deg, var(--green), #166534);
        border: none;
        padding: 14px;
        border-radius: 40px;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 6px;
        font-family: "DM Sans", sans-serif;
      }
      .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 22px -8px rgba(34, 197, 94, 0.4);
      }
      .btn-auth:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      /* Messages */
      .msg {
        font-size: 12.5px;
        margin-top: 4px;
        padding: 9px 13px;
        border-radius: 10px;
        display: none;
      }
      .msg.error {
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.2);
        color: var(--red);
      }
      .msg.success {
        background: rgba(74, 222, 128, 0.07);
        border: 1px solid rgba(74, 222, 128, 0.2);
        color: var(--green);
      }

      /* Footer */
      .auth-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 12.5px;
        color: var(--t3);
      }
      .auth-footer a {
        color: var(--green);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3C9 3 5 7 5 12c0 3 1.4 5.5 3.5 7"
              stroke="#f0fdf4"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M12 3c3 0 7 4 7 9c0 3-1.4 5.5-3.5 7"
              stroke="#a3e635"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M12 22V11M8.5 15l3.5-4 3.5 4"
              stroke="#f0fdf4"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="logo-name">Phyto<span>Sentinel</span></div>
        <div class="logo-sub">DSA Guelma — Espace Agriculteur</div>
      </div>

      <!-- Onglets -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">🔐 Connexion</button>
        <button class="auth-tab" data-tab="register">📝 Inscription</button>
      </div>

      <!-- ── FORMULAIRE CONNEXION ── -->
      <div id="loginForm" class="auth-form">
        <div class="form-group">
          <label>EMAIL OU NOM D'UTILISATEUR</label>
          <input
            type="text"
            id="loginUsername"
            placeholder="ex: ahmed.benali ou ahmed@exemple.com"
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label>MOT DE PASSE</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>
        <div id="loginError" class="msg error"></div>
        <button class="btn-auth" id="doLogin" data-label="Se connecter →">
          Se connecter →
        </button>
        <div class="auth-footer">
          Pas encore de compte ? <a data-switch="register">Inscrivez-vous</a>
        </div>
      </div>

      <!-- ── FORMULAIRE INSCRIPTION ── -->
      <div id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label>NOM COMPLET</label>
          <input type="text" id="regFullname" placeholder="Ahmed Benali" />
        </div>
        <div class="form-group">
          <label>NOM D'UTILISATEUR</label>
          <input
            type="text"
            id="regUsername"
            placeholder="ahmed.benali"
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label>EMAIL</label>
          <input type="email" id="regEmail" placeholder="ahmed@exemple.com" />
        </div>
        <div class="form-group">
          <label>MOT DE PASSE</label>
          <input
            type="password"
            id="regPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <div class="form-group">
          <label>CONFIRMER LE MOT DE PASSE</label>
          <input
            type="password"
            id="regPasswordConfirm"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <div class="form-group">
          <label>COMMUNE (WILAYA DE GUELMA)</label>
          <select id="regCommune">
            <option value="">Sélectionner votre commune</option>
            <option>Guelma</option>
            <option>Belkheir</option>
            <option>Bouchegouf</option>
            <option>Oued Zenati</option>
            <option>Hammam Debagh</option>
            <option>Héliopolis</option>
            <option>El Fedjoudj</option>
            <option>Bouhamdane</option>
            <option>Medjez Amar</option>
            <option>Bouati Mahmoud</option>
            <option>Ain Makhlouf</option>
            <option>Ain Larbi</option>
            <option>Oued Fragha</option>
            <option>Khezaras</option>
            <option>Tamlouka</option>
            <option>Sellaoua Announa</option>
            <option>Bordj Sabath</option>
            <option>Ain Sandel</option>
            <option>Djebala</option>
            <option>Bouhachana</option>
            <option>Guelaat Bou Sba</option>
            <option>Houari Boumediene</option>
            <option>Ain Ben Beida</option>
            <option>Dahouara</option>
            <option>Ben Djarah</option>
            <option>Ras El Agba</option>
            <option>Nechmaya</option>
          </select>
        </div>
        <div id="registerError" class="msg error"></div>
        <div id="registerSuccess" class="msg success"></div>
        <button
          class="btn-auth"
          id="doRegister"
          data-label="Créer mon compte →"
        >
          Créer mon compte →
        </button>
        <div class="auth-footer">
          Déjà inscrit ? <a data-switch="login">Connectez-vous</a>
        </div>
      </div>
    </div>
    <!-- /.auth-card -->

    <script>
      // ─────────────────────────────────────────────────────────────
      // CONFIG
      // ─────────────────────────────────────────────────────────────
      const API_BASE = "http://localhost:5000";

      const STORAGE_TOKEN = "phyto_token";
      const STORAGE_USER = "phyto_user";

      // Destinations après connexion selon le rôle
      const ROLE_REDIRECTS = {
        admin: "admin.html",
        farmer: "agriculteur.html",
        expert: "agriculteur.html",
        technician: "agriculteur.html",
      };

      // ─────────────────────────────────────────────────────────────
      // Si déjà connecté → vérifier le token côté serveur avant de rediriger
      // ─────────────────────────────────────────────────────────────
      (async function checkAlreadyLogged() {
        const token = sessionStorage.getItem(STORAGE_TOKEN);
        const user = (() => {
          try {
            return JSON.parse(sessionStorage.getItem(STORAGE_USER));
          } catch {
            return null;
          }
        })();

        if (!token || !user) {
          // Nettoyer toute donnée résiduelle (ex: ancienne session localStorage)
          sessionStorage.removeItem(STORAGE_TOKEN);
          sessionStorage.removeItem(STORAGE_USER);
          localStorage.removeItem(STORAGE_TOKEN);
          localStorage.removeItem(STORAGE_USER);
          return; // Rester sur login.html
        }

        // Vérification côté serveur avant de rediriger
        try {
          const res = await fetch(`${API_BASE}/api/auth/verify`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status === 401) {
            // Token explicitement invalide → nettoyer et rester sur login.html
            sessionStorage.removeItem(STORAGE_TOKEN);
            sessionStorage.removeItem(STORAGE_USER);
          } else {
            // Token valide (200) OU serveur en erreur (500, 404…) → rediriger
            // On fait confiance au token si le serveur ne répond pas correctement
            window.location.replace(
              ROLE_REDIRECTS[user.role] || "agriculteur.html",
            );
          }
        } catch {
          // Serveur injoignable (réseau, CORS…) → rediriger quand même
          // L'utilisateur a un token valide, agriculteur.html fera sa propre vérification
          window.location.replace(
            ROLE_REDIRECTS[user.role] || "agriculteur.html",
          );
        }
      })();

      // ─────────────────────────────────────────────────────────────
      // GESTION DES ONGLETS
      // ─────────────────────────────────────────────────────────────
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");

      function switchTab(tabId) {
        const isLogin = tabId === "login";
        loginForm.classList.toggle("hidden", !isLogin);
        registerForm.classList.toggle("hidden", isLogin);
        document
          .querySelectorAll(".auth-tab")
          .forEach((t) =>
            t.classList.toggle("active", t.dataset.tab === tabId),
          );
      }

      document
        .querySelectorAll(".auth-tab")
        .forEach((t) =>
          t.addEventListener("click", () => switchTab(t.dataset.tab)),
        );
      document
        .querySelectorAll("[data-switch]")
        .forEach((a) =>
          a.addEventListener("click", () => switchTab(a.dataset.switch)),
        );

      // ─────────────────────────────────────────────────────────────
      // HELPERS
      // ─────────────────────────────────────────────────────────────
      function showMsg(id, text, type = "error") {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `msg ${type}`;
        el.style.display = "block";
        if (type === "error")
          setTimeout(() => (el.style.display = "none"), 6000);
      }

      function setLoading(btn, loading) {
        btn.disabled = loading;
        btn.textContent = loading ? "Chargement…" : btn.dataset.label;
      }

      function saveSession(token, user) {
        // sessionStorage : effacé automatiquement à la fermeture du navigateur
        sessionStorage.setItem(STORAGE_TOKEN, token);
        sessionStorage.setItem(STORAGE_USER, JSON.stringify(user));
        // S'assurer qu'aucune ancienne donnée ne persiste dans localStorage
        localStorage.removeItem(STORAGE_TOKEN);
        localStorage.removeItem(STORAGE_USER);
      }

      function redirectByRole(user) {
        window.location.replace(
          ROLE_REDIRECTS[user.role] || "agriculteur.html",
        );
      }

      // ─────────────────────────────────────────────────────────────
      // CONNEXION
      // ─────────────────────────────────────────────────────────────
      document.getElementById("doLogin").addEventListener("click", async () => {
        const btn = document.getElementById("doLogin");
        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!username || !password) {
          showMsg("loginError", "Veuillez remplir tous les champs.");
          return;
        }

        setLoading(btn, true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username_or_email: username, password }),
          });
          const data = await res.json();

          if (res.ok && data.success) {
            saveSession(data.token, data.user);
            redirectByRole(data.user);
          } else {
            showMsg("loginError", data.error || "Identifiants incorrects.");
          }
        } catch {
          showMsg(
            "loginError",
            "Erreur réseau : impossible de contacter le serveur.",
          );
        } finally {
          setLoading(btn, false);
        }
      });

      // Connexion au clavier
      document
        .getElementById("loginPassword")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") document.getElementById("doLogin").click();
        });

      // ─────────────────────────────────────────────────────────────
      // INSCRIPTION + CONNEXION AUTOMATIQUE
      // ─────────────────────────────────────────────────────────────
      document
        .getElementById("doRegister")
        .addEventListener("click", async () => {
          const btn = document.getElementById("doRegister");
          const fullname = document.getElementById("regFullname").value.trim();
          const username = document.getElementById("regUsername").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirm = document.getElementById("regPasswordConfirm").value;
          const commune = document.getElementById("regCommune").value;

          if (!fullname || !username || !email || !password || !confirm) {
            showMsg("registerError", "Tous les champs sont obligatoires.");
            return;
          }
          if (password !== confirm) {
            showMsg("registerError", "Les mots de passe ne correspondent pas.");
            return;
          }
          if (password.length < 6) {
            showMsg(
              "registerError",
              "Le mot de passe doit contenir au moins 6 caractères.",
            );
            return;
          }

          setLoading(btn, true);
          try {
            // 1. Inscription
            const regRes = await fetch(`${API_BASE}/api/auth/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                full_name: fullname,
                username,
                email,
                password,
                role: "farmer",
                commune,
              }),
            });
            const regData = await regRes.json();

            if (!regRes.ok || !regData.success) {
              showMsg(
                "registerError",
                regData.error || "Erreur lors de l'inscription.",
              );
              return;
            }

            // 2. Connexion automatique
            const loginRes = await fetch(`${API_BASE}/api/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username_or_email: username, password }),
            });
            const loginData = await loginRes.json();

            if (loginRes.ok && loginData.success) {
              saveSession(loginData.token, loginData.user);
              showMsg(
                "registerSuccess",
                "Compte créé ! Redirection en cours…",
                "success",
              );
              setTimeout(() => redirectByRole(loginData.user), 1200);
            } else {
              // Inscription OK mais connexion auto échouée → onglet login
              switchTab("login");
              document.getElementById("loginUsername").value = username;
            }
          } catch {
            showMsg(
              "registerError",
              "Erreur réseau : impossible de contacter le serveur.",
            );
          } finally {
            setLoading(btn, false);
          }
        });
    </script>
  </body>
</html>
